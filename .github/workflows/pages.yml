name: Publish pursuit experiment
on:
  push:
    branches: [main]
    paths:
      - site.zip
      - realeye-runtime.zip
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Unpack tested website
        run: |
          unzip -q site.zip -d site
          unzip -q realeye-runtime.zip -d site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy HTTPS website
        id: deployment
        uses: actions/deploy-pages@v4
